---
- name: Initialize bootc image
  hosts: all
  become: true
  vars:
    bootc_image: ghcr.io/joshgordon/almalinux-k8s-bootc-cluster:latest
  tasks:
    - name: Switch bootc image
      ansible.builtin.command:
        cmd: bootc switch {{ bootc_image }}
      register: bootc_switch
      changed_when: "'Queued for next boot' in bootc_switch.stdout"

    - name: Reboot into new image
      ansible.builtin.reboot:
        reboot_timeout: 300
      when: bootc_switch.changed

- name: Initialize first control plane node
  hosts: k8s_control_plane[0]
  become: true
  vars:
    pod_network_cidr: "10.128.0.0/9"
  tasks:
    - name: Check if cluster is already initialized
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: kubeadm_init_check

    - name: Add temporary VIP to interface
      ansible.builtin.command:
        cmd: ip addr add {{control_plane_vip}}/{{ ansible_default_ipv4.prefix }} dev {{ ansible_default_ipv4.interface }}
      become: true
      register: ip_add
      changed_when: ip_add.rc == 0
      failed_when: "ip_add.rc != 0 and 'RTNETLINK answers: File exists' not in ip_add.stderr"
      when: not kubeadm_init_check.stat.exists

    - name: Initialize the cluster
      ansible.builtin.command: >
        kubeadm init
        --control-plane-endpoint={{ control_plane_vip }}:6443
        --upload-certs
        --pod-network-cidr={{ pod_network_cidr }}
        --skip-phases=addon/kube-proxy
      register: kubeadm_init
      when: not kubeadm_init_check.stat.exists

    - name: Create .kube directory for root
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: "0700"

    - name: Copy admin.conf to root's kube config
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: true
        mode: "0600"

    - name: Get ansible user home directory
      ansible.builtin.getent:
        database: passwd
        key: "{{ ansible_user_id }}"
      when: ansible_user_id != 'root'

    - name: Create .kube directory for ansible user
      ansible.builtin.file:
        path: "{{ getent_passwd[ansible_user_id][4] }}/.kube"
        state: directory
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_id }}"
        mode: "0700"
      when: ansible_user_id != 'root'

    - name: Copy admin.conf to ansible user's kube config
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "{{ getent_passwd[ansible_user_id][4] }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_id }}"
        mode: "0600"
      when: ansible_user_id != 'root'

    - name: Generate certificate key for joining control planes
      ansible.builtin.command: kubeadm init phase upload-certs --upload-certs
      register: cert_key_output
      changed_when: false

    - name: Extract certificate key
      ansible.builtin.set_fact:
        certificate_key: "{{ cert_key_output.stdout_lines[-1] }}"

    - name: Generate join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: kubeadm_join_command
      changed_when: false

    - name: Store join command as fact
      ansible.builtin.set_fact:
        kubeadm_join_cmd: "{{ kubeadm_join_command.stdout }}"

- name: Join additional control plane nodes
  hosts: k8s_control_plane[1:]
  become: true
  serial: 1
  tasks:
    - name: Check if node is already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Join as control plane
      ansible.builtin.command: >
        {{ hostvars[groups['k8s_control_plane'][0]]['kubeadm_join_cmd'] }}
        --control-plane
        --certificate-key {{ hostvars[groups['k8s_control_plane'][0]]['certificate_key'] }}
      when: not kubelet_conf.stat.exists

    - name: Create .kube directory for root
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: "0700"

    - name: Copy admin.conf to root's kube config
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: true
        mode: "0600"

- name: Join worker nodes to cluster
  hosts: k8s_workers
  become: true
  tasks:
    - name: Check if node is already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Join cluster as worker
      ansible.builtin.command: "{{ hostvars[groups['k8s_control_plane'][0]]['kubeadm_join_cmd'] }}"
      when: not kubelet_conf.stat.exists

- name: Install Cilium and configure control planes as workers
  hosts: k8s_control_plane[0]
  become: true
  vars:
    # Direct API server endpoints so Cilium doesn't depend on the VIP it serves
    cilium_api_server_urls: >-
      {{ groups['k8s_control_plane']
         | map('extract', hostvars, ['ansible_default_ipv4', 'address'])
         | map('regex_replace', '^(.*)$', 'https://\1:6443')
         | join(' ') }}
  tasks:
    - name: Check if Cilium is already installed
      ansible.builtin.command: /usr/local/bin/cilium status --wait=false
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: cilium_status
      failed_when: false
      changed_when: false

    - name: Install Cilium
      ansible.builtin.command: >
        /usr/local/bin/cilium install
        --set kubeProxyReplacement=true
        --set k8sServiceHost={{ control_plane_vip }}
        --set k8sServicePort=6443
        --set l2announcements.enabled=true
        --set externalIPs.enabled=true
        --set cni.binPath=/var/lib/cni/bin
        --set k8s.apiServerURLs="{{ cilium_api_server_urls }}"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      when: cilium_status.rc != 0

    - name: Wait for Cilium to be ready
      ansible.builtin.command: /usr/local/bin/cilium status --wait
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: cilium_wait
      retries: 30
      delay: 10
      until: cilium_wait.rc == 0
      changed_when: false

    - name: Create Cilium k8s service L2 LoadBalancer IP pool
      ansible.builtin.copy:
        dest: /tmp/cilium-l2-ippool.yaml
        mode: "0644"
        content: |
          apiVersion: cilium.io/v2alpha1
          kind: CiliumLoadBalancerIPPool
          metadata:
            name: l2-k8s-svc-pool
          spec:
            blocks:
              - start: "{{ control_plane_vip }}"
                stop: "{{ control_plane_vip }}"

    - name: Apply Cilium L2 LoadBalancer IP pool
      ansible.builtin.command: kubectl apply -f /tmp/cilium-l2-ippool.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: ippool_apply
      changed_when: "'created' in ippool_apply.stdout or 'configured' in ippool_apply.stdout"

    - name: Create Cilium L2 announcement policy
      ansible.builtin.copy:
        dest: /tmp/cilium-l2-policy.yaml
        mode: "0644"
        content: |
          apiVersion: cilium.io/v2alpha1
          kind: CiliumL2AnnouncementPolicy
          metadata:
            name: l2-k8s-policy
          spec:
            serviceSelector:
              matchLabels:
                control-plane-svc: "true"
            nodeSelector:
              matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
            interfaces:
              - ^en.*
              - ^eth.*
            externalIPs: true
            loadBalancerIPs: true

    - name: Apply Cilium L2 announcement policy
      ansible.builtin.command: kubectl apply -f /tmp/cilium-l2-policy.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: l2policy_apply
      changed_when: "'created' in l2policy_apply.stdout or 'configured' in l2policy_apply.stdout"

    - name: Create Cilium K8s-api Service
      ansible.builtin.copy:
        dest: /tmp/cilium-k8s-api-svc.yaml
        mode: "0644"
        content: |
          apiVersion: v1
          kind: Service
          metadata:
            name: kube-apiserver-lb
            namespace: kube-system
            labels:
              control-plane-svc: "true"
            annotations:
              lbipam.cilium.io/ips: "{{ control_plane_vip }}"
          spec:
            type: LoadBalancer
            selector:
              component: kube-apiserver
              tier: control-plane
            ports:
            - port: 6443
              targetPort: 6443
              protocol: TCP

    - name: Apply Cilium K8s-api service
      ansible.builtin.command: kubectl apply -f /tmp/cilium-k8s-api-svc.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: svc_apply
      changed_when: "'created' in svc_apply.stdout or 'configured' in svc_apply.stdout"

    - name: Delete temporary control plane VIP
      ansible.builtin.command:
        cmd: ip addr del {{control_plane_vip}}/{{ ansible_default_ipv4.prefix }} dev {{ ansible_default_ipv4.interface }}
      become: true
      register: ip_add
      changed_when: ip_add.rc == 0
      failed_when: "ip_add.rc != 0 and 'Address not found' not in ip_add.stderr"
      when: svc_apply.changed

- name: Verify cluster status
  hosts: k8s_control_plane[0]
  become: true
  tasks:
    - name: Wait for all nodes to be ready
      ansible.builtin.command: kubectl get nodes
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: kubectl_get_nodes
      until: kubectl_get_nodes.stdout_lines | select('search', 'NotReady') | list | length == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: Display cluster nodes
      ansible.builtin.debug:
        msg: "{{ kubectl_get_nodes.stdout_lines }}"

    - name: Display Cilium status
      ansible.builtin.command: /usr/local/bin/cilium status
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: cilium_final_status
      changed_when: false

    - name: Show Cilium status
      ansible.builtin.debug:
        msg: "{{ cilium_final_status.stdout_lines }}"
