---
# Writes a kubeconfig on this machine for reaching the cluster through the
# control plane VIP, logging in through the OIDC issuer set up by
# apply-oidc-login.yml. It holds no credentials: kubectl runs the oidc-login
# plugin (https://github.com/int128/kubelogin), which opens a browser to sign
# in and caches the token.
#
#   ansible-playbook -i inventories/prod.yml get-kubeconfig.yml
#   KUBECONFIG=~/.kube/prod.yaml kubectl get nodes
#
# Set kubeconfig_path to write somewhere else, and oidc_client_secret if the
# issuer's client is confidential rather than public.

- name: Write a kubeconfig for the cluster
  hosts: k8s_control_plane[0]
  become: true
  gather_facts: false
  vars:
    # Named after the inventory file, e.g. "prod" for inventories/prod.yml
    kube_cluster_name: "{{ inventory_file | basename | splitext | first }}"
    kubeconfig_path: "{{ lookup('env', 'HOME') }}/.kube/{{ kube_cluster_name }}.yaml"
  tasks:
    - name: Check the issuer is set
      ansible.builtin.assert:
        that:
          - jwt_issuer_url | default('') | length > 0
          - jwt_issuer_aud | default('') | length > 0
        fail_msg: Set jwt_issuer_url and jwt_issuer_aud in the inventory.
        quiet: true

    - name: Read the cluster CA certificate
      ansible.builtin.slurp:
        src: /etc/kubernetes/pki/ca.crt
      register: cluster_ca

    - name: Write the kubeconfig
      ansible.builtin.copy:
        dest: "{{ kubeconfig_path }}"
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Config
          clusters:
            - name: {{ kube_cluster_name }}
              cluster:
                server: https://{{ control_plane_vip }}:6443
                certificate-authority-data: {{ cluster_ca.content }}
          users:
            - name: {{ kube_cluster_name }}-oidc
              user:
                exec:
                  apiVersion: client.authentication.k8s.io/v1
                  interactiveMode: IfAvailable
                  command: kubectl
                  args:
                    - oidc-login
                    - get-token
                    - --oidc-issuer-url={{ jwt_issuer_url }}
                    - --oidc-client-id={{ jwt_issuer_aud }}
          {% if oidc_client_secret | default('') | length > 0 %}
                    - --oidc-client-secret={{ oidc_client_secret }}
          {% endif %}
                    # profile carries the groups claim on Authentik
                    - --oidc-extra-scope=profile
                    - --oidc-extra-scope=email
          contexts:
            - name: {{ kube_cluster_name }}
              context:
                cluster: {{ kube_cluster_name }}
                user: {{ kube_cluster_name }}-oidc
          current-context: {{ kube_cluster_name }}
      delegate_to: localhost
      become: false

    - name: Show how to use it
      ansible.builtin.debug:
        msg: "KUBECONFIG={{ kubeconfig_path }} kubectl get nodes"
