name: Build disk images

# Turns the published amd64 image into a qcow2 VM disk and an Anaconda
# installer ISO with bootc-image-builder, and uploads both as workflow
# artifacts. arm64 is skipped: that image only carries the Raspberry Pi 5
# kernel, so it isn't useful as a generic VM or installer.

on:
  workflow_run:
    workflows: ["Build image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}:latest
  BUILDER: quay.io/centos-bootc/bootc-image-builder:latest
  # Login created by the ISO installer, with the owner's GitHub SSH keys
  ISO_USER: josh

jobs:
  disk:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - type: qcow2
            output: qcow2/disk.qcow2
          - type: anaconda-iso
            output: bootiso/install.iso
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Pull image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull "$IMAGE"

      - name: Write ISO config
        if: matrix.type == 'anaconda-iso'
        run: |
          # No storage directives, so Anaconda asks which disk to install to
          # rather than wiping one on its own.
          {
            echo '[customizations.installer.kickstart]'
            echo 'contents = """'
            echo "user --name=${ISO_USER} --groups=wheel --lock"
            curl -fsSL "https://github.com/${{ github.repository_owner }}.keys" \
              | sed "s|.*|sshkey --username=${ISO_USER} \"&\"|"
            echo '%post'
            echo "echo '${ISO_USER} ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/${ISO_USER}"
            echo "chmod 0440 /etc/sudoers.d/${ISO_USER}"
            echo '%end'
            echo '"""'
          } > disk/anaconda-iso.toml
          cat disk/anaconda-iso.toml

      - name: Build ${{ matrix.type }}
        run: |
          mkdir -p output
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v ./disk/${{ matrix.type }}.toml:/config.toml:ro \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "$BUILDER" \
            --type ${{ matrix.type }} \
            --rootfs xfs \
            "$IMAGE"
          sudo chown -R "$(id -u):$(id -g)" output
          ls -lh output/${{ matrix.output }}

      - name: Upload ${{ matrix.type }}
        uses: actions/upload-artifact@v7
        with:
          name: almalinux-k8s-${{ matrix.type }}
          path: output/${{ matrix.output }}
          compression-level: 1
