name: Build disk images

# Builds an amd64 qcow2 VM disk from the published image with
# bootc-image-builder, and an installer ISO: a live system (disk/live) with a
# console installer that downloads the image and runs `bootc install to-disk`,
# made with image-builder. Both kinds of install upgrade to the latest image on
# first boot, so these only need refreshing occasionally. arm64 is skipped: that
# image only carries the Raspberry Pi 5 kernel, so it isn't useful as a generic
# VM or installer.
#
# Scheduled and manual runs publish both files as a GitHub release, tagged with
# the date. Pushes only build them, to test changes to disk/.

on:
  schedule:
    - cron: "0 8 1 * *" # monthly, after that day's 06:00 image build
  push:
    branches: [main]
    paths:
      - "disk/**"
      - ".github/workflows/disk-images.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}:latest
  BUILDER: quay.io/centos-bootc/bootc-image-builder:latest
  IMAGE_BUILDER: ghcr.io/osbuild/image-builder-cli:latest

jobs:
  qcow2:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      image-digest: ${{ steps.image.outputs.digest }}
      image-version: ${{ steps.image.outputs.version }}
      packages: ${{ steps.image.outputs.packages }}
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Pull image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull "$IMAGE"

      - name: Record image details
        id: image
        run: |
          echo "digest=$(sudo podman image inspect --format '{{.Digest}}' "$IMAGE")" >> "$GITHUB_OUTPUT"
          echo "version=$(sudo podman image inspect --format '{{index .Labels "org.opencontainers.image.version"}}' "$IMAGE")" >> "$GITHUB_OUTPUT"
          {
            echo 'packages<<EOF'
            sudo podman run --rm --entrypoint rpm "$IMAGE" -q --qf '| %{NAME} | %{VERSION}-%{RELEASE} |\n' \
              kernel kubelet containerd bootc || true
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build qcow2
        run: |
          mkdir -p output
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v ./disk/qcow2.toml:/config.toml:ro \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "$BUILDER" \
            --type qcow2 \
            --rootfs xfs \
            "$IMAGE"
          sudo chown -R "$(id -u):$(id -g)" output
          ls -lh output/qcow2/disk.qcow2

      - name: Upload qcow2
        uses: actions/upload-artifact@v7
        with:
          name: almalinux-k8s-qcow2
          path: output/qcow2/disk.qcow2
          compression-level: 1

  iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # From AlmaLinux atomic-ci: Ubuntu 26.04's bwrap-userns-restrict AppArmor
      # profile strips the capabilities osbuild's stages need. Keep them in
      # bwrap's own profile; does nothing on runners without it.
      - name: Allow bwrap to keep its capabilities
        run: |
          if sudo test -r /etc/apparmor.d/bwrap-userns-restrict &&
             sudo test -r /sys/kernel/security/apparmor/profiles &&
             sudo grep -qx 'bwrap (enforce)' /sys/kernel/security/apparmor/profiles; then
            printf '%s\n' 'priority=100 allow file rwlkm /**,' 'priority=100 allow ix /**,' \
              | sudo tee /etc/apparmor.d/local/bwrap-userns-restrict > /dev/null
            sudo apparmor_parser -Q /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi

      - name: Build live environment
        run: |
          sudo podman build \
            --cap-add=sys_admin \
            --security-opt=label=disable \
            --build-arg IMAGE_REF="$IMAGE" \
            -t localhost/k8s-node-installer \
            -f disk/live/Containerfile \
            disk/live

      - name: Build ISO
        run: |
          mkdir -p output
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "$IMAGE_BUILDER" \
            build \
            --output-dir /output \
            --bootc-ref localhost/k8s-node-installer \
            bootc-generic-iso
          sudo chown -R "$(id -u):$(id -g)" output
          iso=$(find output -name '*.iso' | head -1)
          [[ -f "$iso" ]] || { echo "::error::No ISO in output/"; exit 1; }
          mv "$iso" output/install.iso
          ls -lh output/install.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v7
        with:
          name: almalinux-k8s-iso
          path: output/install.iso
          compression-level: 1

  release:
    needs: [qcow2, iso]
    if: github.event_name != 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIGEST: ${{ needs.qcow2.outputs.image-digest }}
          VERSION: ${{ needs.qcow2.outputs.image-version }}
          PACKAGES: ${{ needs.qcow2.outputs.packages }}
        run: |
          cd assets
          ls -lh
          sha256sum disk.qcow2 install.iso > SHA256SUMS

          # One release per day; a second run that day gets .2, .3, ...
          tag=$(date -u +%Y.%m.%d)
          base=$tag n=1
          while gh release view "$tag" > /dev/null 2>&1; do
            n=$((n + 1))
            tag="$base.$n"
          done

          cat > notes.md <<EONOTES
          amd64 disk images built from \`${IMAGE%:*}@${DIGEST}\`${VERSION:+ (version ${VERSION})}.

          | Package | Version |
          |---|---|
          ${PACKAGES}

          - **\`disk.qcow2\`:** amd64 VM disk with that image installed. Give the VM cloud-init user-data with your user and SSH key.
          - **\`install.iso\`:** amd64 network installer. It downloads and installs the current \`:latest\` image, not necessarily the one above.

          Both upgrade to the latest image on first boot. Check downloads with \`sha256sum -c SHA256SUMS\`.
          EONOTES

          gh release create "$tag" disk.qcow2 install.iso SHA256SUMS \
            --title "Disk images $tag" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
