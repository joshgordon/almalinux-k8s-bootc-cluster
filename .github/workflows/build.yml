name: Build image

# Builds the image with AlmaLinux's atomic-ci: native amd64 and arm64 builds,
# rechunked so updates only download the layers that changed, pushed with the
# branch name as tag, and signed if the SIGNING_SECRET cosign key is set.
# Builds of main are then tagged latest, with the AlmaLinux major and minor
# versions, and with the image version.

on:
  push:
    branches: [main]
    paths:
      - "image/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "image/**"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "0 6 * * *" # daily, to pick up base image and package updates
  workflow_dispatch:

jobs:
  build-image:
    name: Build image
    uses: AlmaLinux/atomic-ci/.github/workflows/build-image.yml@v13
    with:
      containerfile: image/Containerfile
      image-name: almalinux-k8s-bootc-cluster
      image-description: AlmaLinux bootc Kubernetes node
      previous-image: ghcr.io/${{ github.repository }}:latest
      platforms: amd64,arm64
      changelog-snippet: |
        Major Components:
          - Kernel: <relver:kernel>
          - Kubernetes: <relver:kubelet>
          - containerd: <relver:containerd>
          - Bootc: <relver:bootc>
    secrets:
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
    permissions:
      contents: read
      packages: write
      id-token: write

  promote-image:
    name: Promote image
    needs: build-image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: AlmaLinux/atomic-ci/.github/workflows/retag-image.yml@v13
    with:
      image: ${{ needs.build-image.outputs.image-ref }}
      digest: ${{ needs.build-image.outputs.digest }}
      tag: |
        latest
        ${{ needs.build-image.outputs.major-version }}
        ${{ needs.build-image.outputs.redhat-version-id }}
        ${{ needs.build-image.outputs.version }}
    secrets:
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      packages: write
